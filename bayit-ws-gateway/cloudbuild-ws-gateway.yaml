steps:
  - name: 'gcr.io/cloud-builders/docker'
    dir: '.'
    args:
      - 'build'
      - '--no-cache'
      - '-f'
      - './bayit-ws-gateway/Dockerfile'
      - '-t'
      - 'gcr.io/$PROJECT_ID/bayit-ws-gateway:${_BUILD_ID}'
      - '-t'
      - 'gcr.io/$PROJECT_ID/bayit-ws-gateway:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/bayit-ws-gateway:${_BUILD_ID}']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/bayit-ws-gateway:latest']

  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'bayit-ws-gateway'
      - '--image=gcr.io/$PROJECT_ID/bayit-ws-gateway:${_BUILD_ID}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=${_MEMORY}'
      - '--cpu=${_CPU}'
      - '--timeout=3600'
      - '--min-instances=${_MIN_INSTANCES}'
      - '--max-instances=${_MAX_INSTANCES}'

      # CPU boost for faster cold start
      - '--cpu-boost'

      # Environment Variables (trimmed to WS gateway needs)
      - '--set-env-vars=ENVIRONMENT=production'
      - '--set-env-vars=GCP_PROJECT_ID=$PROJECT_ID'
      - '--set-env-vars=LOG_LEVEL=INFO'
      - '--set-env-vars=DEBUG=false'
      - '--set-env-vars=MONGODB_DB_NAME=bayit_plus'
      - '--set-env-vars=SERVICE_NAME=bayit-ws-gateway'
      - '--set-env-vars=I18N_LOCALES_PATH=/app/shared/i18n/locales'

      # Secrets - trimmed to only what WS routes actually use
      # Core: auth token validation, database, Redis pub/sub, CORS, monitoring
      - '--update-secrets=SECRET_KEY=bayit-backend-secret-key:latest,REDIS_URL=bayit-redis-url:latest,MONGODB_URI=bayit-mongodb-uri:latest,BACKEND_CORS_ORIGINS=bayit-backend-cors-origins:latest,SENTRY_DSN=bayit-sentry-dsn:latest'

      # AI: VOD interaction WS uses Anthropic, live dubbing uses ElevenLabs
      - '--update-secrets=ANTHROPIC_API_KEY=bayit-anthropic-api-key:latest,ELEVENLABS_API_KEY=bayit-elevenlabs-api-key:latest'

      # ElevenLabs Voice IDs (live dubbing WS needs Hebrew/English voices)
      - '--update-secrets=ELEVENLABS_DEFAULT_VOICE_ID=bayit-elevenlabs-default-voice-id:latest,ELEVENLABS_HEBREW_VOICE_ID=bayit-elevenlabs-hebrew-voice-id:latest,ELEVENLABS_ENGLISH_VOICE_ID=bayit-elevenlabs-english-voice-id:latest'

      # Avatar data encryption (Zeh Ani WS)
      - '--update-secrets=FERNET_ENCRYPTION_KEY=FERNET_ENCRYPTION_KEY:latest'

images:
  - 'gcr.io/$PROJECT_ID/bayit-ws-gateway:${_BUILD_ID}'
  - 'gcr.io/$PROJECT_ID/bayit-ws-gateway:latest'

substitutions:
  _BUILD_ID: 'latest'
  _REGION: 'us-east1'
  _MEMORY: '1Gi'
  _CPU: '1'
  _MIN_INSTANCES: '1'
  _MAX_INSTANCES: '5'

timeout: '1800s'
