name: BayitPlus
options:
  bundleIdPrefix: tv.bayit.plus
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
  xcodeVersion: "16.0"
  groupSortPosition: top
  generateEmptyDirectories: true
  minimumXcodeGenVersion: "2.40.0"

configFiles:
  Debug: Configuration/Debug.xcconfig
  Release: Configuration/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

packages:
  BayitPlus:
    path: .

targets:
  BayitPlusApp:
    type: application
    platform: iOS
    sources:
      - path: BayitPlusApp
        type: group
        excludes:
          - "ViewModels/VODViewModel+DataLoading.swift"
          - "ViewModels/VODViewModel+Pagination.swift"
          - "Repositories/CategoryRepository+Convenience.swift"
      - path: BayitPlusIPadApp
        type: group
    dependencies:
      - package: BayitPlus
        product: BayitCore
      - package: BayitPlus
        product: BayitNetworking
      - package: BayitPlus
        product: BayitAuth
      - package: BayitPlus
        product: BayitLocalization
      - package: BayitPlus
        product: BayitDesignSystem
      - package: BayitPlus
        product: BayitMedia
      - package: BayitPlus
        product: BayitVoice
      - package: BayitPlus
        product: BayitWidgetShared
      - package: BayitPlus
        product: BayitAnalytics
      - package: BayitPlus
        product: BayitCast
      - package: BayitPlus
        product: BayitNotifications
      - sdk: CarPlay.framework
      - target: BayitWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tv.bayit.plus
        PRODUCT_NAME: BayitPlus
        CODE_SIGN_ENTITLEMENTS: BayitPlusApp/BayitPlusApp.entitlements
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: BayitPlusApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: 963B7732N5
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
  BayitPlusTVApp:
    type: application
    platform: tvOS
    sources:
      - path: BayitPlusTVApp
        type: group
        excludes:
          - "Views/Avatar/TVAvatarModeView+ColorHelpers.swift"
          - "Views/TVPodcastDetailView+EpisodeRow.swift"
          - "Views/TVMovieDetailView+Sections.swift"
          - "Views/TVDubbingMixerView.swift"
          - "Views/TVProfileSelectionView.swift"
      - path: BayitPlusApp/Models
        type: group
      - path: BayitPlusApp/Repositories
        type: group
        excludes:
          - "CategoryRepository+Convenience.swift"
      - path: BayitPlusApp/ViewModels
        type: group
        excludes:
          - "VODViewModel+DataLoading.swift"
          - "VODViewModel+Pagination.swift"
      - path: BayitPlusApp/Helpers/MultipartFormData.swift
      - path: BayitPlusApp/Helpers/HTMLSanitizer.swift
      - path: BayitPlusApp/Helpers/WebSocketDecoder.swift
      - path: BayitPlusApp/Services/DownloadManager.swift
      - path: BayitPlusApp/Services/DownloadManager+Delegate.swift
      - path: BayitPlusApp/Services/DownloadManager+Delegates.swift
      - path: BayitPlusApp/Services/DownloadManager+TaskManagement.swift
      - path: BayitPlusApp/Services/DownloadManager+Tasks.swift
      - path: BayitPlusApp/Services/DownloadStore.swift
      - path: BayitPlusApp/Services/ShabbatModeService.swift
      - path: BayitPlusApp/Services/RecentSearchesService.swift
      - path: BayitPlusApp/Services/OfflineCacheService.swift
      - path: BayitPlusApp/Services/FeatureValidationModels.swift
      - path: BayitPlusApp/Services/FeatureValidationService.swift
      - path: BayitPlusApp/Services/ShoreshParser.swift
      - path: BayitPlusApp/Services/LiveTriviaWebSocketService.swift
      - path: BayitPlusApp/Services/LiveDubbingWebSocketService.swift
      - path: BayitPlusApp/Services/LiveSubtitlesWebSocketService.swift
      - path: BayitPlusApp/Services/PlaybackSessionService.swift
      - path: BayitPlusApp/Services/NetworkMonitor.swift
      - path: BayitPlusApp/Services/KeychainHelper.swift
      - path: BayitPlusApp/Services/AvatarStateMachine.swift
      - path: BayitPlusApp/Services/ProactiveSuggestionEngine.swift
      - path: BayitPlusApp/Services/CatchUpPreferencesService.swift
      - path: BayitPlusApp/Services/PlayerPreferencesService.swift
      - path: BayitPlusApp/App/FeatureFlags.swift
      - path: BayitPlusApp/App/UserUIPreferencesStore.swift
      - path: BayitPlusApp/Resources/Bayit_Intro_Hebrew.mp4
        buildPhase: resources
      - path: BayitPlusApp/Resources/Bayit_Intro_English.mp4
        buildPhase: resources
      - path: BayitPlusApp/Views/Player/DubbingPremiumGateView.swift
      - path: BayitPlusApp/Views/Shared/SubtitleFlagsPill.swift
    dependencies:
      - package: BayitPlus
        product: BayitCore
      - package: BayitPlus
        product: BayitNetworking
      - package: BayitPlus
        product: BayitAuth
      - package: BayitPlus
        product: BayitLocalization
      - package: BayitPlus
        product: BayitDesignSystem
      - package: BayitPlus
        product: BayitMedia
      - package: BayitPlus
        product: BayitVoice
      - package: BayitPlus
        product: BayitAnalytics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tv.bayit.plus
        PRODUCT_NAME: BayitPlusTV
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        TVOS_DEPLOYMENT_TARGET: "17.0"
        DEVELOPMENT_TEAM: 963B7732N5
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: true
    info:
      path: BayitPlusTVApp/Info.plist
      properties:
        API_BASE_URL: "$(API_BASE_URL)"
        WEBSOCKET_BASE_URL: "$(WEBSOCKET_BASE_URL)"
        SUPPORT_EMAIL: "$(SUPPORT_EMAIL)"
        API_RETRYABLE_STATUS_CODES: "$(API_RETRYABLE_STATUS_CODES)"
        PROGRESS_TRACKING_INTERVAL_SECONDS: "$(PROGRESS_TRACKING_INTERVAL_SECONDS)"
        HOME_CONTENT_ROW_LIMIT: "$(HOME_CONTENT_ROW_LIMIT)"
        DEFAULT_CULTURE_ID: "$(DEFAULT_CULTURE_ID)"
        HIDDEN_CHANNEL_KEYWORDS: "$(HIDDEN_CHANNEL_KEYWORDS)"
        CFBundleDisplayName: "Bayit+"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchStoryboardName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - bayitplus
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.624470113582-21du9rcqdbrc6lhk8vctbtqulhoobavf
        GOOGLE_CLIENT_ID: "624470113582-21du9rcqdbrc6lhk8vctbtqulhoobavf.apps.googleusercontent.com"
        GOOGLE_SERVER_CLIENT_ID: "624470113582-7p34b1tpqlfob5sh4cl9eoospmvao1at.apps.googleusercontent.com"
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes:
          - audio

  BayitWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/WidgetExtension
        type: group
    dependencies:
      - package: BayitPlus
        product: BayitCore
      - package: BayitPlus
        product: BayitNetworking
      - package: BayitPlus
        product: BayitLocalization
      - package: BayitPlus
        product: BayitDesignSystem
      - package: BayitPlus
        product: BayitWidgetShared
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tv.bayit.plus.widgets
        PRODUCT_NAME: BayitWidgets
        CODE_SIGN_ENTITLEMENTS: Extensions/WidgetExtension/BayitWidgets.entitlements
        INFOPLIST_FILE: Extensions/WidgetExtension/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        DEVELOPMENT_TEAM: 963B7732N5
        CODE_SIGN_STYLE: Automatic

schemes:
  BayitPlusApp:
    build:
      targets:
        BayitPlusApp: all
        BayitWidgets: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release

  BayitWidgets:
    build:
      targets:
        BayitWidgets: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release

  BayitPlusTVApp:
    build:
      targets:
        BayitPlusTVApp: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
