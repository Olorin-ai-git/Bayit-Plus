name: BayitPlus
options:
  bundleIdPrefix: tv.bayit.plus
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
  xcodeVersion: "16.0"
  groupSortPosition: top
  generateEmptyDirectories: true
  minimumXcodeGenVersion: "2.40.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

packages:
  BayitPlus:
    path: .

targets:
  BayitPlusApp:
    type: application
    platform: iOS
    sources:
      - path: BayitPlusApp
        type: group
    dependencies:
      - package: BayitPlus
        product: BayitCore
      - package: BayitPlus
        product: BayitNetworking
      - package: BayitPlus
        product: BayitAuth
      - package: BayitPlus
        product: BayitLocalization
      - package: BayitPlus
        product: BayitDesignSystem
      - package: BayitPlus
        product: BayitMedia
      - package: BayitPlus
        product: BayitVoice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tv.bayit.plus
        PRODUCT_NAME: "Bayit+"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: BayitPlusApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
  BayitPlusTVApp:
    type: application
    platform: tvOS
    sources:
      - path: BayitPlusTVApp
        type: group
      - path: BayitPlusApp/Models
        type: group
      - path: BayitPlusApp/Repositories
        type: group
      - path: BayitPlusApp/ViewModels
        type: group
    dependencies:
      - package: BayitPlus
        product: BayitCore
      - package: BayitPlus
        product: BayitNetworking
      - package: BayitPlus
        product: BayitAuth
      - package: BayitPlus
        product: BayitLocalization
      - package: BayitPlus
        product: BayitDesignSystem
      - package: BayitPlus
        product: BayitMedia
      - package: BayitPlus
        product: BayitVoice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tv.bayit.plus.tvos
        PRODUCT_NAME: "Bayit+ TV"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        TVOS_DEPLOYMENT_TARGET: "17.0"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: true
    info:
      path: BayitPlusTVApp/Info.plist
      properties:
        CFBundleDisplayName: "Bayit+"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchStoryboardName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - bayitplus

schemes:
  BayitPlusApp:
    build:
      targets:
        BayitPlusApp: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release

  BayitPlusTVApp:
    build:
      targets:
        BayitPlusTVApp: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
