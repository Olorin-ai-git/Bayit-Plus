[tool.poetry]
name = "olorin-email"
version = "1.0.0"
description = "Olorin Ecosystem - Shared Email Service (SendGrid, SMTP, Templates)"
authors = ["Olorin Team <dev@olorin.ai>"]
readme = "README.md"
packages = [{include = "olorin_email"}]

[tool.poetry.dependencies]
python = "^3.11"
httpx = "^0.28.0"
pydantic = "^2.12.0"
pydantic-settings = "^2.7.0"
jinja2 = "^3.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
black = "^23.11.0"
mypy = "^1.7.0"
isort = "^5.12.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
