name: Full Battery

# Full codebase tightening + test + smoke battery.
# Mirrors scripts/ci/full-battery.sh so local and CI runs stay identical.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: full-battery-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'
  # Lets .npmrc (@olorin GitHub Packages auth) resolve during npm ci.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  tighten:
    name: Tighten (lint / types / rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: pipx install poetry
      - name: Install JS deps
        run: npm ci || npm install --no-audit --no-fund
      - name: Install backend deps
        working-directory: backend
        run: poetry install --no-interaction --no-root
      # Blocking: platform rules (no emojis, no stray console.log).
      - name: Platform rules (blocking)
        run: scripts/ci/tighten.sh --rules-only
      # Advisory: lint/type/format ride on a baseline still being cleaned up.
      # Ratchet these to blocking once the monorepo lint/type debt is cleared.
      - name: Backend format/types (advisory)
        run: scripts/ci/tighten.sh --backend-only
        continue-on-error: true
      - name: JS lint/type-check (advisory)
        run: scripts/ci/tighten.sh --js-only
        continue-on-error: true

  backend-tests:
    name: Backend tests (pytest)
    # Advisory while the test/coverage baseline is stabilized.
    continue-on-error: true
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
    env:
      MONGODB_URL: mongodb://localhost:27017
      MONGODB_DB_NAME: bayit_test
      SECRET_KEY: test-secret-key
      DEBUG: 'true'
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: pipx install poetry
      - name: Install backend deps
        working-directory: backend
        run: poetry install --no-interaction --no-root
      - name: Run backend test phase
        run: scripts/ci/full-battery.sh backend

  web-tests:
    name: Web tests (jest)
    # Advisory while the test baseline is stabilized.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install JS deps
        run: npm ci || npm install --no-audit --no-fund
      - name: Run web test phase
        run: scripts/ci/full-battery.sh web

  e2e-tests:
    name: E2E tests (Playwright)
    # Advisory: e2e needs a running app/preview; not a merge gate yet.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install JS deps
        run: npm ci || npm install --no-audit --no-fund
      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run e2e phase (advisory)
        # E2E needs running services; keep advisory until wired to a deploy/preview.
        run: STRICT=0 scripts/ci/full-battery.sh e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  smoke:
    name: Smoke (backend boot + web build)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
    env:
      MONGODB_URL: mongodb://localhost:27017
      MONGODB_DB_NAME: bayit_smoke
      SECRET_KEY: smoke-secret-key
      DEBUG: 'true'
      ENVIRONMENT: test
      BACKEND_PORT: '8000'
      SMOKE_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: pipx install poetry
      - name: Install JS deps
        run: npm ci || npm install --no-audit --no-fund
      - name: Install backend deps
        working-directory: backend
        run: poetry install --no-interaction --no-root
      - name: Run smoke phase
        run: scripts/ci/full-battery.sh smoke
