name: Claudette App Store credential check

on:
  push:
    branches: [ops/claudette-asc-check-20260912-74075]
    paths:
      - '.github/workflows/claudette-asc-check.yml'
      - 'scripts/deployment/check-claudette-asc.mjs'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/deployment/check-claudette-asc.mjs
          sparse-checkout-cone-mode: false
      - name: Check Claudette app access without exporting credentials
        env:
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_API_ISSUER }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_API_KEY_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_API_KEY }}
          ASC_BUNDLE_ID: com.olorin.claudette
          ASC_APP_ID: '6759467788'
          ASC_APPS_ENDPOINT: https://api.appstoreconnect.apple.com/v1/apps
          ASC_EXPECTED_ORIGIN: https://api.appstoreconnect.apple.com
          ASC_TOKEN_AUDIENCE: appstoreconnect-v1
          ASC_TOKEN_TTL_SECONDS: '300'
          ASC_REQUEST_TIMEOUT_MS: '30000'
          ASC_RESULT_LIMIT: '2'
          STORE_HISTORY_ENDPOINT: https://api.storekit.apple.com/inApps/v1/notifications/history
          STORE_EXPECTED_ORIGIN: https://api.storekit.apple.com
          STORE_HISTORY_WINDOW_MS: '60000'
        run: node scripts/deployment/check-claudette-asc.mjs
      - name: Identify the existing Google service account
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GCP_SA_KEY }}
        run: |
          node --input-type=module <<'NODE'
          try {
            const account = JSON.parse(process.env.GOOGLE_SERVICE_ACCOUNT);
            if (account.type !== 'service_account' ||
                !/^[a-z0-9-]+@[a-z0-9-]+\.iam\.gserviceaccount\.com$/.test(account.client_email) ||
                !/^[a-z][a-z0-9-]+$/.test(account.project_id)) throw new Error();
            process.stdout.write(JSON.stringify({ result: 'google_identity_identified',
              clientEmail: account.client_email, projectId: account.project_id }) + '\n');
          } catch {
            process.stdout.write('{"result":"google_identity_not_verified"}\n');
            process.exitCode = 1;
          }
          NODE
