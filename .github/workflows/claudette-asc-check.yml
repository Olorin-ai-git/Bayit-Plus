name: Claudette App Store credential check

on:
  push:
    branches: [ops/claudette-asc-check-20260912-74075]
    paths:
      - '.github/workflows/claudette-asc-check.yml'
      - 'scripts/deployment/check-claudette-asc.mjs'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/deployment/check-claudette-asc.mjs
          sparse-checkout-cone-mode: false
      - name: Check Claudette app access without exporting credentials
        env:
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_API_ISSUER }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_API_KEY_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_API_KEY }}
          ASC_BUNDLE_ID: com.olorin.claudette
          ASC_APP_ID: '6759467788'
          ASC_APPS_ENDPOINT: https://api.appstoreconnect.apple.com/v1/apps
          ASC_EXPECTED_ORIGIN: https://api.appstoreconnect.apple.com
          ASC_TOKEN_AUDIENCE: appstoreconnect-v1
          ASC_TOKEN_TTL_SECONDS: '300'
          ASC_REQUEST_TIMEOUT_MS: '30000'
          ASC_RESULT_LIMIT: '2'
          STORE_HISTORY_ENDPOINT: https://api.storekit.apple.com/inApps/v1/notifications/history
          STORE_EXPECTED_ORIGIN: https://api.storekit.apple.com
          STORE_HISTORY_WINDOW_MS: '60000'
          ASC_PROVISION_SECRET_VERSIONS: ${{ contains(github.event.head_commit.message, '[provision-claudette-iap]') }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GCP_SA_KEY }}
          GOOGLE_EXPECTED_SERVICE_ACCOUNT: bayit-plus@appspot.gserviceaccount.com
          GOOGLE_EXPECTED_PROJECT: bayit-plus
          GOOGLE_TARGET_PROJECT_NUMBER: '879990819695'
          GOOGLE_OAUTH_ENDPOINT: https://oauth2.googleapis.com/token
          GOOGLE_OAUTH_ORIGIN: https://oauth2.googleapis.com
          GOOGLE_SECRET_MANAGER_ENDPOINT: https://secretmanager.googleapis.com/v1/
          GOOGLE_SECRET_MANAGER_ORIGIN: https://secretmanager.googleapis.com
          GOOGLE_OAUTH_SCOPE: https://www.googleapis.com/auth/cloud-platform
          GOOGLE_OAUTH_GRANT_TYPE: urn:ietf:params:oauth:grant-type:jwt-bearer
          GOOGLE_TOKEN_TTL_SECONDS: '300'
          ASC_ISSUER_SECRET: claudette-relay-apple-iap-issuer-id
          ASC_KEY_ID_SECRET: claudette-relay-apple-iap-key-id
          ASC_PRIVATE_KEY_SECRET: claudette-relay-apple-iap-private-key
        run: node scripts/deployment/check-claudette-asc.mjs
      - name: Identify the existing Google service account
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GCP_SA_KEY }}
        run: |
          node --input-type=module <<'NODE'
          try {
            let account;
            try { account = JSON.parse(process.env.GOOGLE_SERVICE_ACCOUNT); }
            catch { throw new Error('google_identity_invalid_json'); }
            if (account?.type !== 'service_account') throw new Error('google_identity_invalid_type');
            if (!/^[a-z0-9-]+@[a-z0-9.-]+\.gserviceaccount\.com$/.test(account.client_email)) {
              throw new Error('google_identity_invalid_email');
            }
            if (!/^[a-z][a-z0-9-]+$/.test(account.project_id)) throw new Error('google_identity_invalid_project');
            process.stdout.write(JSON.stringify({ result: 'google_identity_identified',
              clientEmail: account.client_email, projectId: account.project_id }) + '\n');
          } catch (error) {
            const codes = new Set(['google_identity_invalid_json', 'google_identity_invalid_type',
              'google_identity_invalid_email', 'google_identity_invalid_project']);
            process.stdout.write(JSON.stringify({ result: codes.has(error?.message)
              ? error.message : 'google_identity_not_verified' }) + '\n');
            process.exitCode = 1;
          }
          NODE
      - name: Check public distribution certificate metadata
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          IOS_EXPECTED_TEAM: 963B7732N5
          IOS_CERTIFICATE_TIMEOUT_MS: '30000'
          IOS_CERTIFICATE_MAX_OUTPUT_BYTES: '1048576'
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { X509Certificate } from 'node:crypto';
          try {
            const data = process.env.IOS_CERTIFICATE_BASE64?.replace(/\s/g, '');
            const team = process.env.IOS_EXPECTED_TEAM;
            const timeout = Number(process.env.IOS_CERTIFICATE_TIMEOUT_MS);
            const maxBuffer = Number(process.env.IOS_CERTIFICATE_MAX_OUTPUT_BYTES);
            if (!data || !/^[A-Za-z0-9+/]+={0,2}$/.test(data) ||
                !/^[A-Z0-9]{10}$/.test(team) || !process.env.IOS_CERTIFICATE_PASSWORD ||
                !Number.isSafeInteger(timeout) || timeout <= 0 ||
                !Number.isSafeInteger(maxBuffer) || maxBuffer <= 0) throw new Error();
            const args = ['pkcs12', '-clcerts', '-nokeys', '-passin', 'env:IOS_CERTIFICATE_PASSWORD'];
            const options = { input: Buffer.from(data, 'base64'), timeout, maxBuffer,
              stdio: ['pipe', 'pipe', 'pipe'], env: { PATH: process.env.PATH,
                IOS_CERTIFICATE_PASSWORD: process.env.IOS_CERTIFICATE_PASSWORD } };
            let output;
            try { output = execFileSync('openssl', args, options).toString(); }
            catch { output = execFileSync('openssl', [...args, '-legacy'], options).toString(); }
            const certificates = output.match(/-----BEGIN CERTIFICATE-----[\s\S]+?-----END CERTIFICATE-----/g);
            if (certificates?.length !== 1) throw new Error();
            const certificate = new X509Certificate(certificates[0]);
            const now = Date.now();
            const teamMatches = certificate.subject.split('\n').includes(`OU=${team}`);
            const validNow = Date.parse(certificate.validFrom) <= now && now < Date.parse(certificate.validTo);
            const distribution = /CN=(Apple Distribution|iPhone Distribution):/.test(certificate.subject);
            process.stdout.write(JSON.stringify({ result: 'distribution_certificate_metadata_checked',
              teamMatches, validNow, distribution, expires: certificate.validTo,
              fingerprint256: certificate.fingerprint256 }) + '\n');
            if (!teamMatches || !validNow || !distribution) process.exitCode = 1;
          } catch {
            process.stdout.write(JSON.stringify({ result: 'distribution_certificate_not_verified' }) + '\n');
            process.exitCode = 1;
          }
          NODE
