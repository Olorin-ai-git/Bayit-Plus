name: Deploy Documentation Portal

on:
  push:
    branches:
      - main
      - beta
    paths:
      - 'docs/**'
      - 'docs-portal/**'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: docs-portal/package-lock.json

      - name: Install dependencies
        working-directory: docs-portal
        run: npm ci

      - name: Build VitePress site
        working-directory: docs-portal
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: bayit-plus
          target: docs-portal
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      - name: Add deployment comment
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '✅ Documentation deployed to Firebase Hosting\n\n🔗 https://docs.bayitplus.com'
            })

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitepress-dist
          path: docs-portal/.vitepress/dist
          retention-days: 7
